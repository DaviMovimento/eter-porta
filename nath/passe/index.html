<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Revista ETER</title>
<link rel="canonical" href="https://clkdmg.site/pay/passe-de-30-dias">
<style>html{{background:#F2EEE6;color:#5A5044;font:400 1rem/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}}
body{{display:grid;place-items:center;min-height:100vh;margin:0;text-align:center;padding:2rem}}
a{{color:#7D6429}}</style>
</head>
<body>
<p>Abrindo a revista…<br><a id="ir" href="https://clkdmg.site/pay/passe-de-30-dias">continuar</a></p>
<script>
(() => {{
  const p = new URLSearchParams(location.search);
  /* o parametro da ponte e o padrao; se a campanha mandar o dela, a dela vence */
  const fixos = {"src": "nath", "sck": "direto-nath", "utm_source": "embaixador", "utm_medium": "indicacao", "utm_campaign": "nath"};
  for (const [k, v] of Object.entries(fixos)) if (!p.get(k)) p.set(k, v);
  const q = p.toString();
  const d = "https://clkdmg.site/pay/passe-de-30-dias" + (q ? "?" + q : "");
  document.getElementById('ir').href = d;
  location.replace(d);
}})();
</script>
</body>
</html>
